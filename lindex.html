<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMOS Technology</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #d4af37;
      --gold-soft: #e8cf74;
      --bg1: #0b1020;
      --bg2: #18213b;
      --text: #e9edf5;
      --muted: #bfc8dc;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(212,175,55,0.14), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 780px;
      padding: 54px 36px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 24px 70px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }

    .logo-wrap {
      margin-bottom: 24px;
    }

    .logo {
      max-width: 340px;
      width: 100%;
      max-height: 110px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .fallback-brand {
      display: none;
    }

    h1 {
      font-size: 2.15rem;
      margin-bottom: 14px;
      color: var(--gold-soft);
      letter-spacing: 0.01em;
    }
    h4 {
      margin-bottom: 14px;
      color: var(--gold-soft);
      letter-spacing: 0.01em;
    }
    .tagline {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 auto 28px;
      max-width: 580px;
    }

    .services {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .service {
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.28);
      color: #f3e5aa;
      font-size: 0.95rem;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .primary {
      background: linear-gradient(180deg, #e6c75c, var(--gold));
      color: #161616;
    }

    .secondary {
      color: #f3e5aa;
      border: 1px solid rgba(212,175,55,0.35);
      background: rgba(212,175,55,0.06);
    }

    footer {
      margin-top: 36px;
      color: #8f98ad;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .card {
        padding: 42px 22px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrap">
      <img src="logo.png" alt="LUMOS Technology logo" class="logo">
    </div>

    <h1>Technology that <u>works</u> for you</h1>

    <p class="tagline">
      IT support, network design, and technology consulting.
    </p>

    <div class="services">
      <span class="service">Managed IT Sevrices</span>
      <span class="service">Networking</span>
      <span class="service">Cybersecurity</span>
      <span class="service">Consulting</span>
    </div>

    <div class="buttons">
      <a class="button primary" href="mailto:george@lumostechnology.net">Email</a>
      <a class="button secondary" href="tel:+19705087459">Call</a>
    </div>

    
<h4>Proudly serving Northern Colorado.</h4>
    <footer>
      © 2026 LUMOS Technology
    </footer>
  </main>
</body>
</html>
